<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sentinel</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="map" aria-label="Map of sites and incidents"></div>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
      <circle cx="20" cy="20" r="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".7"/>
      <circle cx="20" cy="20" r="3" fill="currentColor"/>
      <path d="M20 20 L34 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>Sentinel</h1>
      <div class="sub">Security intelligence</div>
    </div>
  </div>
  <div class="readouts" id="readouts"></div>
  <div class="top-actions">
    <span class="threat" id="threat"></span>
    <button id="run-now" class="pill gold">Check now</button>
  </div>
</header>

<nav class="rail" id="rail" aria-label="Map layers"></nav>

<aside class="panel alerts" id="alerts-panel" aria-label="Alerts">
  <div class="panel-head">
    <h2>Alerts</h2>
    <button class="icon-btn" id="alerts-toggle" aria-label="Hide alerts panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="counts" id="counts" aria-label="Open alerts by severity"></div>
  <figure class="activity">
    <figcaption><span>Alerts per hour · 24 h</span><span id="activity-total"></span></figcaption>
    <div class="bars" id="activity"></div>
    <div class="tooltip" id="activity-tip" hidden></div>
  </figure>
  <div class="filters">
    <div class="tabs" id="categories" role="group" aria-label="Category"></div>
    <select id="status" aria-label="Alert status">
      <option value="new">Open</option>
      <option value="acknowledged">Acknowledged</option>
      <option value="dismissed">Dismissed</option>
      <option value="">All</option>
    </select>
  </div>
  <div class="feed" id="feed" aria-live="polite"></div>
</aside>
<button class="pill reopen" id="alerts-open" hidden>Alerts</button>

<aside class="panel drawer" id="drawer" hidden aria-label="Details">
  <div class="panel-head">
    <h2 id="drawer-title"></h2>
    <button class="icon-btn" id="drawer-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="map-controls">
  <div class="pill-group" role="group" aria-label="Base map">
    <button class="pill" data-base="sat" aria-pressed="true">Satellite</button>
    <button class="pill" data-base="streets" aria-pressed="false">Streets</button>
    <button class="pill" data-base="dark" aria-pressed="false">Dark</button>
  </div>
  <div class="pill-group" role="group" aria-label="Zoom">
    <button class="pill" id="zoom-out" aria-label="Zoom out">−</button>
    <button class="pill" id="zoom-in" aria-label="Zoom in">+</button>
    <button class="pill" id="zoom-sites">All sites</button>
  </div>
  <div class="cursor" id="cursor">Cursor — · Zoom —</div>
</div>

<footer class="ticker" aria-label="Latest events">
  <div class="ticker-track" id="ticker"></div>
  <div class="online" id="online"></div>
</footer>

<script src="/vendor/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>

name = "sentinel"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sentinel"
database_id = "a871a59c-9d85-4193-8892-42faf06543ed"
migrations_dir = "migrations"

[vars]
CLASSIFIER_MODEL = "claude-opus-5-5"
MIN_EMAIL_SEVERITY = "medium"
DASHBOARD_URL = "https://sentinel.aipti.workers.dev"
ALERT_EMAIL_FROM = ""
ALERT_EMAIL_TO = ""
ALERT_SMS_TO = ""
TWILIO_FROM_NUMBER = ""

# Secrets, set with `wrangler secret put <NAME>`:
#   ANTHROPIC_API_KEY, DASHBOARD_PASSWORD, SENDGRID_API_KEY,
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN
